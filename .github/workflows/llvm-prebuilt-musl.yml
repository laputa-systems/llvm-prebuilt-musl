name: LLVM prebuilt musl

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release once both architectures build and validate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}-linux-musl
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      LLVM_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      # The pinned version and source checksum live in llvm-source.env.
      - name: Load pinned LLVM version
        run: cat llvm-source.env >> "$GITHUB_ENV"

      # Caches only save time; `make source` verifies the archive whatever the
      # cache contained, and ccache never changes build results.
      - name: Restore LLVM source archive
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: work/download
          key: llvm-source-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_SHA256 }}

      - name: Fetch and verify LLVM source
        run: make source

      - name: Save LLVM source archive
        if: steps.source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: work/download
          key: llvm-source-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_SHA256 }}

      - name: Compute ccache key
        run: |
          echo "CCACHE_KEY=ccache-v3-${{ matrix.arch }}-${{ env.LLVM_VERSION }}-${{ hashFiles('docker/build.Dockerfile', 'cmake/llvm-musl-distribution.cmake', 'scripts/build.sh', 'patches/*.patch') }}" >> "$GITHUB_ENV"

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: work/ccache
          key: ${{ env.CCACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CCACHE_KEY }}-
            ccache-v3-${{ matrix.arch }}-${{ env.LLVM_VERSION }}-

      # Build, optimizer regressions, install, package (ccache statistics are
      # printed at the end of the log).
      - name: Build
        run: make build

      - name: Validate the package in a clean container
        run: make validate

      - name: Check ccache contents
        id: ccache-contents
        if: always()
        run: |
          if [ -d work/ccache ] && find work/ccache -type f -print -quit | grep -q .; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Save ccache
        if: always() && steps.ccache-contents.outputs.present == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: work/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: clang+llvm-${{ env.LLVM_VERSION }}-${{ matrix.arch }}-linux-musl
          path: work/${{ matrix.arch }}/dist/clang+llvm-${{ env.LLVM_VERSION }}-${{ matrix.arch }}-linux-musl.tar.xz
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: work/${{ matrix.arch }}/logs/build.log
          if-no-files-found: ignore

  # Runs only when requested, and only after both architectures passed.
  release:
    if: ${{ inputs.release }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned LLVM version
        run: cat llvm-source.env >> "$GITHUB_ENV"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: clang+llvm-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- *.tar.xz > checksums

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="llvm-musl-${LLVM_VERSION}-${GITHUB_SHA::7}"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes ""
